<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Panel — Chai Pe Charcha</title>
<meta name="robots" content="noindex,nofollow"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="admin.css"/>
</head>
<body>

<button type="button" class="mob-nav-btn" onclick="toggleSidebar()" aria-label="Menu">&#9776;</button>

<aside class="sidebar">
  <div class="sb-logo"><h2>&#9749; Chai Pe Charcha</h2><p>Admin Panel</p></div>
  <nav class="sb-nav">
    <div class="sb-item act" onclick="showView('orders',this)"><span class="sb-ic">&#128203;</span> All Orders</div>
    <div class="sb-item" onclick="showView('pending',this)"><span class="sb-ic">&#9203;</span> Pending</div>
    <div class="sb-item" onclick="showView('menu',this)"><span class="sb-ic">&#127869;</span> Menu Items</div>
  </nav>
  <div class="sb-foot">
    <div class="sb-admin"><span>Logged in as</span><strong id="admin-name">Admin</strong></div>
    <button type="button" class="logout-btn" onclick="doLogout()">Logout</button>
  </div>
</aside>

<main class="main">
  <div class="top-bar">
    <div>
      <h1 id="page-title">Orders</h1>
      <div class="auto-badge"><span class="auto-dot"></span> Auto-refresh 30s</div>
    </div>
    <button type="button" class="refresh-btn" onclick="loadAll()">&#8635; Refresh</button>
  </div>

  <div class="stats">
    <div class="sc"><div class="sc-val o" id="s-total">—</div><div class="sc-label">Orders</div></div>
    <div class="sc"><div class="sc-val y" id="s-pending">—</div><div class="sc-label">Pending</div></div>
    <div class="sc"><div class="sc-val g" id="s-accepted">—</div><div class="sc-label">Accepted</div></div>
    <div class="sc"><div class="sc-val r" id="s-rejected">—</div><div class="sc-label">Rejected</div></div>
  </div>

  <div id="view-orders" class="view-panel act">
    <div id="tbl-container" class="tbl-wrap"><div class="no-data">Loading…</div></div>
  </div>

  <div id="view-pending" class="view-panel"></div>
  <div id="view-accepted" class="view-panel"></div>
  <div id="view-rejected" class="view-panel"></div>

  <div id="view-menu" class="view-panel">
    <div class="menu-toolbar">
      <input type="search" id="menu-search" placeholder="Search items…" oninput="loadMenuAdmin()"/>
      <select id="menu-cat-filter" onchange="loadMenuAdmin()"><option value="">All categories</option></select>
      <select id="menu-svc-filter" onchange="loadMenuAdmin()">
        <option value="">All services</option>
        <option value="dinein">Dine In</option>
        <option value="takeaway">Take Away</option>
        <option value="delivery">Delivery</option>
      </select>
      <select id="menu-active-filter" onchange="loadMenuAdmin()">
        <option value="">All status</option>
        <option value="1">Active only</option>
        <option value="0">Hidden only</option>
      </select>
      <button type="button" class="btn-add" onclick="openItemForm()">+ Add Item</button>
    </div>
    <p class="hint">Changes save to the database and appear on the website immediately.</p>
    <div id="menu-list" class="menu-grid"></div>
  </div>
</main>

<div id="item-modal" class="modal">
  <div class="modal-box">
    <h2 id="modal-title">Edit Item</h2>
    <form onsubmit="saveItem(event)">
      <input type="hidden" id="mf-id"/>
      <label>Name<input id="mf-name" required/></label>
      <label>Price (Rs.)<input id="mf-price" type="number" min="0" step="1" required/></label>
      <label>Image file name<input id="mf-image" placeholder="IMG_5499.JPG" required/></label>
      <label>Category<select id="mf-category" required></select></label>
      <fieldset class="svc-checks">
        <legend>Available for</legend>
        <label><input type="checkbox" id="mf-dinein"/> Dine In</label>
        <label><input type="checkbox" id="mf-takeaway"/> Take Away</label>
        <label><input type="checkbox" id="mf-delivery"/> Delivery</label>
      </fieldset>
      <label class="chk-row"><input type="checkbox" id="mf-active" checked/> Show on website (active)</label>
      <div class="modal-btns">
        <button type="button" class="btn-cancel" onclick="closeItemForm()">Cancel</button>
        <button type="submit" class="btn-save">Save</button>
      </div>
    </form>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="api.js"></script>
<script src="admin.js"></script>
</body>
</html>
