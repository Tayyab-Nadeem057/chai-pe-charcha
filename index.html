<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Chai Pe Charcha &rdquo;&#195;&#162;&#194;&#128;&#194;&#156; Loading</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,900;1,400&family=Cormorant+Garamond:ital,wght@1,300&display=swap" rel="stylesheet"/>
  <style>
    *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
    html,body{height:100%;overflow:hidden}
    body{
      background:#0D0500;
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      font-family:'Inter',sans-serif;position:relative;
    }

    /* BG Canvas for animated gradient */
    #bg-canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}

    /* Radial glow behind text */
    .center-glow{
      position:absolute;width:600px;height:600px;border-radius:50%;
      background:radial-gradient(circle,rgba(255,106,0,.18) 0%,transparent 70%);
      top:50%;left:50%;transform:translate(-50%,-50%);pointer-events:none;
      animation:pulseGlow 3s ease-in-out infinite;
    }
    @keyframes pulseGlow{0%,100%{transform:translate(-50%,-50%) scale(1);opacity:.7}50%{transform:translate(-50%,-50%) scale(1.15);opacity:1}}

    /* Content */
    .loader-wrap{
      position:relative;z-index:10;
      display:flex;flex-direction:column;align-items:center;gap:0;
      animation:fadeUp .8s ease both;
    }
    @keyframes fadeUp{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}

    .load-icon{
      font-size:4rem;margin-bottom:24px;
      filter:drop-shadow(0 0 20px rgba(255,106,0,.7));
      animation:iconFloat 2s ease-in-out infinite;
    }
    @keyframes iconFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

    .load-title{
      font-family:'Playfair Display',serif;font-weight:900;
      font-size:clamp(3rem,8vw,6rem);color:#FFF5E4;text-align:center;
      line-height:1;letter-spacing:-.02em;
      text-shadow:0 0 60px rgba(255,106,0,.4),0 0 120px rgba(255,106,0,.15);
    }
    .load-title .orange{
      background:linear-gradient(135deg,#FF6A00,#FFB347);
      -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    }
    .load-sub{
      font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.3rem;
      color:rgba(255,245,228,.55);margin-top:14px;letter-spacing:.04em;
    }

    /* Decorative line */
    .deco-line{
      width:120px;height:1px;margin:28px auto;
      background:linear-gradient(90deg,transparent,#FF6A00,transparent);
    }

    /* Progress */
    .prog-wrap{width:200px;height:2px;background:rgba(255,106,0,.15);border-radius:99px;overflow:hidden;margin-top:32px}
    .prog-bar{height:100%;width:0%;background:linear-gradient(90deg,#FF6A00,#FFB347);border-radius:99px;box-shadow:0 0 12px rgba(255,106,0,.8);transition:width .12s ease}
    .prog-txt{color:rgba(255,245,228,.45);font-size:.72rem;margin-top:10px;letter-spacing:.12em;text-transform:uppercase}

    /* Exit */
    .exit-ov{position:fixed;inset:0;background:#0D0500;transform:translateY(100%);z-index:9999;transition:transform .55s cubic-bezier(.77,0,.175,1);pointer-events:none}
    .exit-ov.go{transform:translateY(0)}

    /* Steam wisps */
    .wisp{position:absolute;width:3px;border-radius:3px;background:linear-gradient(to top,rgba(255,106,0,.25),transparent);filter:blur(6px);animation:wisp linear infinite;pointer-events:none}
    @keyframes wisp{0%{transform:translateY(0) scaleX(1);opacity:.6}100%{transform:translateY(-60vh) scaleX(2.5);opacity:0}}
  </style>
</head>
<body>
  <canvas id="bg-canvas"></canvas>
  <div class="center-glow"></div>
  <div id="wisps"></div>

  <div class="loader-wrap">
    <div class="load-icon">&#9749;</div>
    <h1 class="load-title">Chai Pe<br/><span class="orange">Charcha</span></h1>
    <div class="deco-line"></div>
    <p class="load-sub">Where every sip starts a conversation</p>
    <div class="prog-wrap"><div class="prog-bar" id="pbar"></div></div>
    <p class="prog-txt" id="ptxt">Brewing your experience...</p>
  </div>

  <div class="exit-ov" id="exit-ov"></div>

  <script>
  // Animated background canvas &rdquo;&#195;&#162;&#194;&#128;&#194;&#157; floating sparks
  const canvas=document.getElementById('bg-canvas');
  const ctx=canvas.getContext('2d');
  let W,H,sparks=[];
  function resize(){W=canvas.width=innerWidth;H=canvas.height=innerHeight}
  resize();window.addEventListener('resize',resize);
  for(let i=0;i<120;i++){
    sparks.push({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.5+.2,
      vx:(Math.random()-.5)*.3,vy:-Math.random()*.4-.1,a:Math.random()*.4+.05});
  }
  function drawBg(){
    ctx.clearRect(0,0,W,H);
    // subtle warm vignette
    const grad=ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,W*.7);
    grad.addColorStop(0,'rgba(40,10,0,0.0)');
    grad.addColorStop(1,'rgba(0,0,0,0.5)');
    ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    // sparks
    sparks.forEach(s=>{
      ctx.beginPath();
      ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
      ctx.fillStyle=`rgba(255,${120+Math.random()*80},0,${s.a})`;
      ctx.fill();
      s.x+=s.vx;s.y+=s.vy;
      if(s.y<-5){s.y=H+5;s.x=Math.random()*W;}
    });
    requestAnimationFrame(drawBg);
  }
  drawBg();

  // Wisps
  const ws=document.getElementById('wisps');
  for(let i=0;i<12;i++){
    const w=document.createElement('div');w.className='wisp';
    const h=60+Math.random()*120;
    w.style.cssText=`bottom:${Math.random()*30}%;left:${Math.random()*100}%;height:${h}px;
      animation-duration:${4+Math.random()*5}s;animation-delay:${Math.random()*6}s`;
    ws.appendChild(w);
  }

  // Progress
  const pbar=document.getElementById('pbar');
  const ptxt=document.getElementById('ptxt');
  const msgs=['Brewing your experience...','Warming the chai...','Almost ready...','Let\'s go! &#9749;'];
  let pct=0;
  const iv=setInterval(()=>{
    pct+=Math.random()*2.5+.8;
    if(pct>=100){pct=100;clearInterval(iv);}
    pbar.style.width=pct+'%';
    ptxt.textContent=msgs[Math.min(Math.floor(pct/30),msgs.length-1)];
    if(pct>=100)setTimeout(()=>{
      document.getElementById('exit-ov').classList.add('go');
      setTimeout(()=>location.href='home.html',560);
    },500);
  },55);
  </script>
</body>
</html>
