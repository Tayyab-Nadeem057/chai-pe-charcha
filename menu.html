<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<meta name="description" content="Explore the full menu at Chai Pe Charcha — authentic Pakistani mains, BBQ &amp; grill, snacks, and value deals. Fresh food, great taste, fast delivery."/>
<meta name="keywords" content="Chai Pe Charcha menu, Pakistani restaurant, chicken karahi, biryani, BBQ, food delivery"/>
<meta property="og:title" content="Menu — Chai Pe Charcha"/>
<meta property="og:description" content="Authentic Pakistani food — Karhai, Burgers, Pizza, Rolls, Chai and more. Order online from Chai Pe Charcha."/>
<meta property="og:type" content="website"/>
<title>Menu &mdash; Chai Pe Charcha | Authentic Pakistani Restaurant</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<link rel="stylesheet" href="mobile.css"/>
<link rel="stylesheet" href="menu-styles.css"/>
</head>
<body>
<div class="pt-overlay"></div>

<!-- HEADER / NAVBAR -->
<header>
  <nav id="nav" aria-label="Main navigation">
    <div class="nav-in">
      <a href="home.html" class="nav-logo" data-pg aria-label="Chai Pe Charcha — Home"></a>
      <ul class="nav-links" role="list">
        <li><a href="home.html" class="nl" data-pg>Home</a></li>
        <li><a href="menu.html" class="nl" data-pg>Menu</a></li>
        <li><a href="track.html" class="nl" data-pg>Track Order</a></li>
        <li><a href="contact.html" class="nl" data-pg>Contact</a></li>
      </ul>
      <button id="theme-toggle" aria-label="Toggle day/night mode" title="Toggle Day / Night Mode">
        <div class="theme-toggle-track">
          <span class="t-icon t-sun">&#9728;</span>
          <span class="t-icon t-moon">&#9790;</span>
        </div>
        <div class="theme-toggle-knob"></div>
      </button>
      <button class="hbg" id="hbg" aria-label="Open mobile menu" aria-expanded="false">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>
  <div class="mob-menu" id="mob-menu" role="navigation" aria-label="Mobile navigation">
    <a href="home.html" class="mob-lnk" data-pg>Home</a>
    <a href="menu.html" class="mob-lnk" data-pg>Menu</a>
    <a href="track.html" class="mob-lnk" data-pg>Track Order</a>
    <a href="contact.html" class="mob-lnk" data-pg>Contact</a>
  </div>
</header>

<!-- MAIN CONTENT -->
<main>

  <!-- HERO -->
  <div class="menu-hero" role="banner">
    <span class="lbl rev">Our Menu</span>
    <h1 class="rev" style="--d:.1s">Crafted with <span class="grad">Love &amp; Spice</span></h1>
    <p class="rev" style="--d:.2s">Every dish made fresh, every bite crafted with heart</p>
  </div>

  <!-- STICKY CATEGORY NAV — pills injected by JS -->
  <nav class="cat-nav" id="catNav" aria-label="Menu categories">
    <div class="cat-nav-in" id="catNav-in"></div>
  </nav>

  <div id="service-banner" class="service-banner" role="status" aria-live="polite"></div>

  <!-- ALL SECTIONS — injected dynamically by menu-app.js -->
  <div id="menu-main"></div>

</main>

<!-- FOOTER -->
<footer>
  <div class="ft-in">
    <div class="ft-brand">
      <a href="home.html" class="brand-lockup-slot brand-compact" data-pg aria-label="Chai Pe Charcha"></a>
      <p>Where great food brings people together</p>
    </div>
    <nav aria-label="Footer navigation">
      <div class="ft-links">
        <a href="home.html" data-pg>Home</a>
        <a href="menu.html" data-pg>Menu</a>
        <a href="contact.html" data-pg>Contact</a>
      </div>
    </nav>
    <p class="ft-copy">&copy; 2025 Chai Pe Charcha &middot; Made with &#10084; &amp; passion</p>
  </div>
</footer>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<!-- CART -->
<div class="cart-overlay" id="cart-overlay" onclick="closeCart()" aria-hidden="true"></div>
<div class="cart-drawer" id="cart-drawer" role="dialog" aria-label="Shopping cart" aria-modal="true">
  <div class="cd-head">
    <h2>Your Cart &#127869;</h2>
    <button class="cd-close" onclick="closeCart()" aria-label="Close cart">&#10005;</button>
  </div>
  <div class="cd-body" id="cd-body"></div>
  <div class="cd-foot" id="cd-foot" style="display:none">
    <div class="cd-msg" id="cd-msg" role="alert"></div>
    <div class="cd-row">
      <div class="cd-section"><label for="cd-name">Your Name</label><input id="cd-name" placeholder="Ali Khan" required autocomplete="name"/></div>
      <div class="cd-section"><label for="cd-phone">Phone</label><input id="cd-phone" placeholder="03021807669" required autocomplete="tel"/></div>
    </div>
    <div class="cd-section"><label for="cd-addr">Delivery Address</label><input id="cd-addr" placeholder="House #, Area, Hyderabad" required autocomplete="street-address"/></div>
    <button class="cd-place-btn" id="cd-place-btn" onclick="placeOrder()">Place Order &#x2192;</button>
  </div>
</div>
<button class="float-cart" id="float-cart" onclick="openCart()" aria-label="View cart">🛒 View Cart <span class="fc-badge" id="fc-badge" aria-live="polite">0</span></button>

<script src="api.js?v=3"></script>
<script src="brand-logo.js"></script>
<script src="shared.js?v=2"></script>
<script src="menu-app.js?v=6"></script>
</body>
</html>
